[metadata]
name = rust-sensei
version = 0.1.0
description = Local-first MCP server for adaptive Rust learning.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.11
include_package_data = true
install_requires =
    pydantic>=2.0.0

[options.packages.find]
include = rust_sensei*

[options.package_data]
rust_sensei =
    resources/*.json

[options.extras_require]
mcp =
    mcp>=1.0.0
dev =
    pytest>=8.0.0
    pytest-cov>=5.0.0
dev-mcp =
    mcp>=1.0.0
    pytest>=8.0.0
    pytest-cov>=5.0.0

[options.entry_points]
console_scripts =
    rust-sensei = rust_sensei.cli:main

[coverage:run]
branch = true
source =
    rust_sensei
omit =
    rust_sensei/__main__.py

[coverage:report]
fail_under = 85
show_missing = true
skip_covered = true
